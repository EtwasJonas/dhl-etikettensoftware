# Werks-Defaults der DHL-Etikettensoftware (vorkalibriert)
#
# Diese Werte wurden am 03.11.2026 mit echten DHL-Privatkunden-Paketmarken
# auf einem Vretti/SN 420B (4"x6"-Rollen, 203 dpi) kalibriert und
# druckidentisch verifiziert:
#   Rand oben/unten je 5,0 mm, seitlich symmetrisch je 13,39 mm,
#   Inhalt 74,9 x 142,4 mm, Scheren-Schnittlinie des A4-Bogens draussen,
#   Barcode/QR unverzerrt (Uniform-Scale) und scannbar.
#
# Gilt fuer das Standard-A4-Layout des DHL-Privatkundenportals
# (Marke in der oberen Haelfte, Schere am Mittelfalz).
# Druckername und Papierformat sind geraetespezifisch und werden im Setup
# gewaehlt - alles andere hier ist vorkonfiguriert.
#
# Diese Datei wird von allen Setups gelesen (Windows-GUI, Linux-GUI,
# install.sh). Aenderungen wirken auf neue Installationen; bestehende
# config.conf bleiben unangetastet.

[crop]
side = top
trim_top_mm = 16.24
trim_bottom_mm = 16.66
trim_left_mm = 3.08
trim_right_mm = 4.13
target_size_mm = 101.6x152.4
rotate = auto
